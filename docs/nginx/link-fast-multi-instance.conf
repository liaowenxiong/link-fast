upstream backend_prod {
    server 127.0.0.1:8080;   # 生产 Tomcat
}

upstream backend_test {
    server 127.0.0.1:8081;   # 测试 Tomcat
}

server {
    listen 80;
    server_name 112.124.51.99;   # 可追加域名

    access_log /var/log/nginx/linkfast_access.log;
    error_log  /var/log/nginx/linkfast_error.log;

    # ---------- 前端：生产环境（根路径） ----------
    location / {
        root /var/www/linkfast-admin;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 前端：测试环境（/test 路径） ----------
    location /test {
        alias /var/www/linkfast-admin-test;
        index index.html index.htm;
        try_files $uri $uri/ /test/index.html;
    }

    # ---------- 后端 API：生产环境（/api/） ----------
    location /api/ {
        proxy_pass http://backend_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 后端 API：测试环境（/test-api/） ----------
    # 注意：请求 /test-api/xxx 会被重写为 /api/xxx 再转发给测试 Tomcat
    location /test-api/ {
        rewrite ^/test-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 根据请求路径判断使用哪个根目录
        set $root_path /var/www/linkfast-admin;
        if ($uri ~* "^/test/") {
            set $root_path /var/www/linkfast-admin-test;
        }
        root $root_path;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 安全加固 ----------
    location ~ ^/(manager|host-manager|docs|examples) {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json;
}